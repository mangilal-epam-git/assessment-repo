name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Run static checks
        run: npm run check


  test:
    name: Tests (Node ${{ matrix.node }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The service must run on every platform the team develops on.
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['22.x']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Run tests with coverage thresholds
        run: npm run test:report

      - name: Publish the result to the job summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Test results — ${{ matrix.os }}, Node ${{ matrix.node }}"
            echo
            if [ -f reports/junit.xml ]; then
              total=$(grep -o '<testcase ' reports/junit.xml | wc -l | tr -d ' ')
              failed=$(grep -o '<failure' reports/junit.xml | wc -l | tr -d ' ')
              echo "| Metric | Value |"
              echo "| --- | --- |"
              echo "| Tests | $total |"
              echo "| Failures | $failed |"
            else
              echo "No JUnit report was produced."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.os }}-node${{ matrix.node }}
          path: reports/
          retention-days: 14

      - name: Publish a test report check
        if: always() && matrix.os == 'ubuntu-latest'
        uses: mikepenz/action-junit-report@v5
        with:
          report_paths: reports/junit.xml
          check_name: Test results
          include_passed: false
          fail_on_failure: true

      - name: Deterministic fixture demo
        run: npm run demo

  container:
    name: Container build and smoke test
    runs-on: ubuntu-latest
    needs: [static-checks, test]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build service image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          load: true
          tags: vectorharbor/best-offers:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build mock provider image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.mock
          load: true
          tags: vectorharbor/mock-providers:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build fleet assistant image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.agent
          load: true
          tags: vectorharbor/fleet-assistant:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start the stack
        run: |
          docker compose up -d --wait --wait-timeout 120
          docker compose ps

      - name: Smoke test
        run: BASE_URL=http://localhost:8080 npm run smoke

      - name: Verify the deterministic fixture result end to end
        run: |
          set -euo pipefail
          # The winning provider for each product is fixed by the brief's
          # fixtures and evaluation instant; a drift here is a contract break.
          actual=$(curl -fsS http://localhost:8080/best-offers \
            | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const b=JSON.parse(s);console.log(b.offers.map(o=>o.productId+'='+o.providerId+'@'+o.costPer1000ValidEventsEUR).join(','))})")
          expected='eu-north-diagnostics-hour=telemetry1@0.193787,eu-north-location-hour=telemetry2@0.115404,eu-north-temperature-hour=telemetry2@0.434708,eu-west-braking-hour=telemetry2@0.178241,eu-west-ev-health-hour=telemetry2@0.435417'
          echo "actual:   $actual"
          echo "expected: $expected"
          test "$actual" = "$expected"

      - name: Verify the supervision invariant end to end
        run: |
          set -euo pipefail
          A=http://localhost:8082

          # The assistant drafts a proposal and nothing else happens.
          PID=$(curl -fsS -X POST $A/agent/ask -H 'content-type: application/json' \
            -d '{"message":"Review the fleet and recommend any maintenance."}' \
            | node -pe "JSON.parse(require('fs').readFileSync(0,'utf8')).proposals[0].proposalId")
          test "$(curl -fsS $A/agent/fleet | node -pe "JSON.parse(require('fs').readFileSync(0,'utf8')).workOrders.length")" = "0"

          DIGEST=$(curl -fsS $A/agent/proposals/$PID | node -pe "JSON.parse(require('fs').readFileSync(0,'utf8')).proposal.valuesDigest")

          # The agent must not be able to approve its own proposal.
          CODE=$(curl -s -o /dev/null -w '%{http_code}' -X POST $A/agent/proposals/$PID/approve \
            -H 'content-type: application/json' \
            -d "{\"approver\":\"agent:fleet-assistant\",\"valuesDigest\":\"$DIGEST\"}")
          test "$CODE" = "409"

          # A human can, and only then does a work order exist.
          TOKEN=$(curl -fsS -X POST $A/agent/proposals/$PID/approve -H 'content-type: application/json' \
            -d "{\"approver\":\"ci-approver\",\"valuesDigest\":\"$DIGEST\"}" \
            | node -pe "JSON.parse(require('fs').readFileSync(0,'utf8')).approvalToken")
          curl -fsS -X POST $A/agent/execute -H 'content-type: application/json' \
            -d "{\"approvalToken\":\"$TOKEN\",\"actor\":\"ci-approver\"}" > /dev/null
          test "$(curl -fsS $A/agent/fleet | node -pe "JSON.parse(require('fs').readFileSync(0,'utf8')).workOrders.length")" = "1"

          # The token must not be replayable.
          CODE=$(curl -s -o /dev/null -w '%{http_code}' -X POST $A/agent/execute \
            -H 'content-type: application/json' \
            -d "{\"approvalToken\":\"$TOKEN\",\"actor\":\"ci-approver\"}")
          test "$CODE" = "409"

          # The ledger must verify and the invariant must hold.
          curl -fsS $A/agent/audit/verify | node -e "
            let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{
              const v=JSON.parse(s);
              if (!v.chain.valid) { console.error('audit chain broken'); process.exit(1); }
              if (!v.supervision.holds) { console.error('supervision invariant breached'); process.exit(1); }
              console.log('chain intact over '+v.chain.length+' entries; supervision holds');
            })"

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v

  terraform:
    name: Terraform ${{ matrix.stack }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stack: [aws, azure]
    defaults:
      run:
        working-directory: infrastructure/${{ matrix.stack }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      # Advisory, not blocking, and deliberately so: this configuration was
      # authored in an environment without the Terraform binary, so canonical
      # formatting has never been applied. Run `terraform fmt -recursive`
      # once, commit the result, then flip continue-on-error to false to make
      # this a real gate. Validation below is blocking regardless.
      - name: Check formatting (advisory until first normalised)
        id: fmt
        continue-on-error: true
        run: terraform fmt -check -recursive -diff

      - name: Note formatting drift in the job summary
        if: steps.fmt.outcome == 'failure'
        run: |
          {
            echo "### Terraform formatting (${{ matrix.stack }})"
            echo
            echo 'Not canonically formatted. Fix with:'
            echo
            echo '```bash'
            echo 'terraform fmt -recursive infrastructure/'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Initialise without a backend
        run: terraform init -backend=false
      - name: Validate
        run: terraform validate -no-color

  # Two scanners, deliberately. Trivy needs no account, so every push and
  # every fork gets a baseline scan. Snyk adds static analysis of our own
  # code, which is where the risk actually lives in a repository with no
  # dependencies - but it needs a token, so it degrades to a skip rather
  # than a red build when one is not configured.
  trivy:
    name: Trivy scan (no account required)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Scan the filesystem and IaC for vulnerabilities and misconfigurations
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: '0'

      - name: Upload results to code scanning
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif
          category: trivy

  snyk:
    name: Snyk scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # Secrets cannot be referenced in a job-level `if`, so the guard is a
      # step. Without a token the job reports how to configure one and stops,
      # rather than failing a build for a missing optional integration.
      - name: Is Snyk configured?
        id: guard
        run: |
          if [ -z "$SNYK_TOKEN" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Snyk scan skipped"
              echo
              echo 'No `SNYK_TOKEN` secret is configured, so the Snyk scan did not run.'
              echo 'Trivy still scanned this commit.'
              echo
              echo 'To enable: create a token at https://app.snyk.io/account and add it'
              echo 'as a repository secret named `SNYK_TOKEN`.'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install the Snyk CLI
        if: steps.guard.outputs.configured == 'true'
        uses: snyk/actions/setup@master

      # Open Source. Expected to find nothing: there are no dependencies.
      # Run anyway so the zero-dependency position is evidenced each build
      # rather than taken on trust.
      - name: Dependencies
        if: steps.guard.outputs.configured == 'true'
        run: snyk test --severity-threshold=high || echo "No manifest or no dependencies to scan."

      # Static analysis of our own code. With no dependencies this is where
      # the real risk is, so it is a blocking gate.
      - name: Our own code (SAST)
        if: steps.guard.outputs.configured == 'true'
        run: snyk code test --severity-threshold=high --sarif-file-output=snyk-code.sarif

      - name: Terraform
        if: steps.guard.outputs.configured == 'true'
        run: snyk iac test infrastructure --severity-threshold=high --sarif-file-output=snyk-iac.sarif

      - name: Build images for container scanning
        if: steps.guard.outputs.configured == 'true'
        run: |
          docker build -t vectorharbor/best-offers:scan .
          docker build -f Dockerfile.mock  -t vectorharbor/mock-providers:scan .
          docker build -f Dockerfile.agent -t vectorharbor/fleet-assistant:scan .

      # Base-image CVEs are frequently unfixable until upstream rebuilds, so
      # this fails only when Snyk knows of an available fix. An unactionable
      # red build teaches people to ignore the scanner.
      - name: Container images
        if: steps.guard.outputs.configured == 'true'
        run: |
          snyk container test vectorharbor/best-offers:scan --file=Dockerfile \
            --severity-threshold=high --fail-on=upgradable \
            --sarif-file-output=snyk-container-best-offers.sarif
          snyk container test vectorharbor/mock-providers:scan --file=Dockerfile.mock \
            --severity-threshold=high --fail-on=upgradable
          snyk container test vectorharbor/fleet-assistant:scan --file=Dockerfile.agent \
            --severity-threshold=high --fail-on=upgradable

      - name: Upload Snyk results to code scanning
        if: always() && steps.guard.outputs.configured == 'true'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: .
          category: snyk

      - name: Keep a monitored snapshot of the default branch
        if: steps.guard.outputs.configured == 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: snyk monitor --all-projects --project-name=vectorharbor-marketplace || true
