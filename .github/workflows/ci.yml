name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Run static checks
        run: npm run check


  test:
    name: Tests (Node ${{ matrix.node }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The service must run on every platform the team develops on.
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['22.x']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Run tests with coverage thresholds
        run: npm test
      - name: Deterministic fixture demo
        run: npm run demo

  container:
    name: Container build and smoke test
    runs-on: ubuntu-latest
    needs: [static-checks, test]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build service image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          load: true
          tags: vectorharbor/best-offers:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build mock provider image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.mock
          load: true
          tags: vectorharbor/mock-providers:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start the stack
        run: |
          docker compose up -d --wait --wait-timeout 120
          docker compose ps

      - name: Smoke test
        run: BASE_URL=http://localhost:8080 npm run smoke

      - name: Verify the deterministic fixture result end to end
        run: |
          set -euo pipefail
          # The winning provider for each product is fixed by the brief's
          # fixtures and evaluation instant; a drift here is a contract break.
          actual=$(curl -fsS http://localhost:8080/best-offers \
            | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const b=JSON.parse(s);console.log(b.offers.map(o=>o.productId+'='+o.providerId+'@'+o.costPer1000ValidEventsEUR).join(','))})")
          expected='eu-north-diagnostics-hour=telemetry1@0.193787,eu-north-location-hour=telemetry2@0.115404,eu-north-temperature-hour=telemetry2@0.434708,eu-west-braking-hour=telemetry2@0.178241,eu-west-ev-health-hour=telemetry2@0.435417'
          echo "actual:   $actual"
          echo "expected: $expected"
          test "$actual" = "$expected"

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v

  terraform:
    name: Terraform ${{ matrix.stack }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stack: [aws, azure]
    defaults:
      run:
        working-directory: infrastructure/${{ matrix.stack }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - name: Check formatting
        run: terraform fmt -check -recursive
      - name: Initialise without a backend
        run: terraform init -backend=false
      - name: Validate
        run: terraform validate -no-color

  security:
    name: Security scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Scan the filesystem and IaC for vulnerabilities and misconfigurations
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: '0'

      - name: Upload results to code scanning
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif
