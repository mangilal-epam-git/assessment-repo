name: Deploy

# Manual, environment-gated deployment. The plan is always reviewed before an
# apply, and the apply runs against a protected GitHub Environment so that a
# human approval is recorded for audit.

on:
  workflow_dispatch:
    inputs:
      cloud:
        description: Target cloud
        required: true
        type: choice
        options: [aws, azure]
      environment:
        description: Target environment
        required: true
        type: choice
        options: [dev, staging, prod]
      apply:
        description: Apply the plan (unchecked = plan only)
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write # OIDC federation; no long-lived cloud keys are stored

concurrency:
  group: deploy-${{ inputs.cloud }}-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  plan:
    name: Plan (${{ inputs.cloud }}/${{ inputs.environment }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    defaults:
      run:
        working-directory: infrastructure/${{ inputs.cloud }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        if: inputs.cloud == 'aws'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Azure via OIDC
        if: inputs.cloud == 'azure'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Initialise with the remote backend
        run: terraform init -backend-config="environments/${{ inputs.environment }}.backend.hcl"

      - name: Select or create the workspace
        run: terraform workspace select -or-create "${{ inputs.environment }}"

      - name: Plan
        run: terraform plan -var-file="environments/${{ inputs.environment }}.tfvars" -out=tfplan -no-color

      - name: Publish the plan for review
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ inputs.cloud }}-${{ inputs.environment }}
          path: infrastructure/${{ inputs.cloud }}/tfplan
          retention-days: 7

  apply:
    name: Apply (${{ inputs.cloud }}/${{ inputs.environment }})
    runs-on: ubuntu-latest
    needs: plan
    if: inputs.apply
    # A protected environment adds the required reviewers and records approval.
    environment: ${{ inputs.environment }}-apply
    defaults:
      run:
        working-directory: infrastructure/${{ inputs.cloud }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        if: inputs.cloud == 'aws'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Azure via OIDC
        if: inputs.cloud == 'azure'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ inputs.cloud }}-${{ inputs.environment }}
          path: infrastructure/${{ inputs.cloud }}

      - name: Initialise with the remote backend
        run: terraform init -backend-config="environments/${{ inputs.environment }}.backend.hcl"

      - name: Apply the reviewed plan
        run: terraform apply -auto-approve tfplan

      - name: Smoke test the deployed service
        run: |
          BASE_URL="$(terraform output -raw service_url)" npm run smoke
        working-directory: .
